# EMQX 5 config overlay, mounted over the image's default /opt/emqx/etc/emqx.conf.
# EMQX's HOCON config system applies its own defaults for anything not set
# here (listeners, cluster, dashboard, etc.), so this only needs the pieces
# Phase 2 actually changes: HTTP authentication + file-based ACL.
#
# NOT independently verified against a running broker (this sandbox has no
# Docker) — the HTTP request/response contract this points at (POST /mqtt/auth,
# {"result": "allow"|"deny"}) IS verified via
# apps/api/src/mqtt/mqtt-auth.service.spec.ts, but EMQX's exact HOCON
# directive names for this EMQX image version need a live check:
#   docker compose up -d emqx && docker compose logs emqx
# and confirm no config-parse errors on boot.

authentication = [
  {
    mechanism = password_based
    backend = http
    method = post
    url = "http://api:4000/mqtt/auth"
    body {
      username = "${username}"
      password = "${password}"
      clientid = "${clientid}"
    }
    headers {
      "content-type" = "application/json"
      "x-emqx-auth-secret" = "${EMQX_AUTH_HOOK_SECRET}"
    }
    pool_size = 8
    connect_timeout = "5s"
    request_timeout = "5s"
  }
]

# Authorization (topic ACL) deliberately does NOT call back into the API —
# devices authenticate with username = clientid = deviceId, so a file-based
# rule templated on ${username} scopes a device to its own topic namespace
# with zero extra round-trips (see infra/emqx/acl.conf).
authorization {
  sources = [
    { type = file, enable = true, path = "/opt/emqx/etc/acl.conf" }
  ]
  no_match = deny
}
