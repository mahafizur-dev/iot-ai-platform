% EMQX file-based ACL (Erlang-term rule DSL). Devices connect with
% username = clientid = deviceId (see mqtt-auth.service.ts), so templating on
% ${username} scopes each device to only its own topic namespace — this is
% what stops one compromised device from reading/spoofing another's data
% (docs/ARCHITECTURE.md §6). NOT independently verified against a running
% broker — see the note at the top of emqx.conf.

{allow, {username, "${username}"}, subscribe, ["iot/+/${username}/#"]}.

{allow, {username, "${username}"}, publish, [
  "iot/+/${username}/telemetry",
  "iot/+/${username}/status",
  "iot/+/${username}/events",
  "iot/+/${username}/commands/ack"
]}.

{deny, all, all, ["#"]}.
